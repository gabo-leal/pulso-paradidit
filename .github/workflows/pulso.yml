name: Pulso Paradidit
on:
  schedule:
    - cron: '0 */3 * * *'   # cada 3 horas (UTC)
  workflow_dispatch: {}      # botón para dispararlo a mano
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test y build del pulso
        env:
          STRIPE_LW_KEY: ${{ secrets.STRIPE_LW_KEY }}
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          node --test
          npm run build
      - name: Cifrar el dashboard con contraseña (staticrypt)
        env:
          STATICRYPT_PASSWORD: ${{ secrets.PULSO_PASSWORD }}
        run: |
          npx --yes staticrypt dist/index.html --short -d dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
